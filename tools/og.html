<!doctype html><html lang="ru"><head>

@font-face{font-family:Lora;src:url(../src/static/fonts/lora-cyrillic.woff2);font-weight:400 700}

*{box-sizing:border-box}body{margin:0}
.c{width:1200px;height:630px;position:relative;overflow:hidden;font-family:Golos;color:#fff}
.c img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%}

.k{font-size:24px;opacity:.92;margin:0 0 12px;letter-spacing:.3px}
.row{display:flex;gap:10px;justify-content:center;margin-top:20px}
.row span{padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);font-size:21px;font-weight:500;backdrop-filter:blur(8px)}
.row b{color:#F6C26B}
/* фото на всю картинку: деревья слева, дом справа; текст между ними — в середине (x 285–915), её мессенджер показывает квадратом при наборе сообщения */
.b img.bg{left:-30px;top:-40px;width:1500px;height:1000px;object-fit:cover;object-position:0 0}
.b .sh{position:absolute;inset:0;background:radial-gradient(520px 480px at 430px 330px,rgba(8,22,18,.78),rgba(8,22,18,.45) 55%,rgba(8,22,18,0) 100%)}
.b .tx{position:absolute;left:300px;top:0;bottom:0;width:400px;display:flex;flex-direction:column;justify-content:center;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.b .mk{color:#fff;margin-bottom:14px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.b h1{font-size:68px;line-height:1.02;text-shadow:inherit}
.b .k{margin:16px 0 0;font-size:25px;line-height:1.35;opacity:1;font-weight:500}
.b .li{margin-top:18px;font-size:23px;font-weight:600;color:#fff}
.b .li b{color:#F6C26B}
