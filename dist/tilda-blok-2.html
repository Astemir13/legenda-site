        sv('path', {d:L, 'class':'gap'}, svg); path(L, it[4] === 2 ? 'view' : 'win');
        if (it[4] === 2){ var mx = (s.a[0]+s.b[0])/2, my = (s.a[1]+s.b[1])/2, sd = side(it[1]); var t = sv('text', {x:mx, y:sd === 't' ? my + 16 : my - 8, 'class':'vw'}, svg); t.textContent = 'вид на горы'; t.style.animationDelay = '1s'; } }
      else if (k === 'door'){ var sd2 = side(it[1]), a0 = it[2], dw = 0.9; s = seg(sd2, a0, a0 + dw); var ax = s.a[0], ay = s.a[1], bx = s.b[0], by = s.b[1];
        sv('path', {d:'M'+ax+' '+ay+'L'+bx+' '+by, 'class':'gap'}, svg);
        var r = dw*S, inv = sd2 === 'b' ? -1 : 1; path('M'+ax+' '+ay+'l0 '+(inv*r)+'A'+r+' '+r+' 0 0 '+((sd2==='b') !== mir ? 1 : 0)+' '+bx+' '+by, 'door');
        T(a0 + dw/2, sd2 === 'b' ? H + 0.42 : -0.25, 'вход', 'ent'); }
      else if (k === 'bath'){ var x = it[1], y = it[2], w = it[3], h = it[4];
        path(R(x, y, w, h), 'w2'); path(R(x + 0.12, y + 0.12, 0.85, 0.85) + 'M'+(pad + rx(x+0.12, 0.85)*S)+' '+Y(y+0.12)+'l'+(0.85*S)+' '+(0.85*S), 'f');
        var tx = rx(x + w - 0.55, 0.4); path('M'+(pad+tx*S)+' '+Y(y+h-0.75)+'a'+(0.2*S)+' '+(0.28*S)+' 0 1 0 '+(0.4*S)+' 0Z', 'f');
        T(x + w/2 + (mir ? 0 : 0), y + h/2 + 0.35, 'с/у'); }
      else if (k === 'bed2' || k === 'bed1'){ var bw = k === 'bed2' ? 1.6 : 0.9, bl = 2.0, hd = it[3], x2 = it[1], y2 = it[2], ww = hd === 't' ? bw : bl, hh = hd === 't' ? bl : bw;
        path(R(x2, y2, ww, hh), 'f'); var hdm = side(hd), np = k === 'bed2' ? 2 : 1, i;
        for (i = 0; i < np; i++){ if (hd === 't'){ var pw = (bw - 0.2*(np+1)) / np; path(R(x2 + 0.2 + i*(pw + 0.2), y2 + 0.12, pw, 0.38), 'f'); }
          else { var ph = (bw - 0.2*(np+1)) / np, px = hd === 'l' ? x2 + 0.12 : x2 + bl - 0.5; path(R(px, y2 + 0.2 + i*(ph + 0.2), 0.38, ph), 'f'); } }
        if (hd === 't') path('M'+X(x2)+' '+Y(y2 + 0.8)+'H'+X(x2 + bw), 'f'); else { var fx = hd === 'l' ? x2 + 0.75 : x2 + bl - 0.75; path('M'+X(fx)+' '+Y(y2)+'V'+Y(y2 + bw), 'f'); } }
      else if (k === 'sofa'){ var sx = it[1], sy = it[2], sl = it[3], sb = it[4], dp = 0.85, vert = sb === 'l' || sb === 'r', w3 = vert ? dp : sl, h3 = vert ? sl : dp;
        path(R(sx, sy, w3, h3), 'f');
        if (vert){ var bxx = sb === 'l' ? sx + 0.22 : sx + dp - 0.22; path('M'+X(bxx)+' '+Y(sy)+'V'+Y(sy + sl), 'f'); } else { var byy = sb === 't' ? sy + 0.22 : sy + dp - 0.22; path('M'+X(sx)+' '+Y(byy)+'H'+X(sx + sl), 'f'); } }
      else if (k === 'ward'){ path(R(it[1], it[2], it[3], it[4]) + 'M'+(pad+rx(it[1], it[3])*S)+' '+Y(it[2])+'l'+(it[3]*S)+' '+(it[4]*S), 'f'); }
      else if (k === 'table'){ path(R(it[1], it[2], it[3], it[4]), 'f'); }
      else if (k === 'stairs'){ var st = 'M0 0', sx2 = it[1], sy2 = it[2], sw = it[3], sh = it[4], steps = 8, j; path(R(sx2, sy2, sw, sh), 'f');
        for (j = 1; j < steps; j++){ st = 'M'+X(sx2)+' '+Y(sy2 + sh*j/steps)+'H'+X(sx2 + sw); path(st, 'f'); } }
      else if (k === 'lbl'){ T(it[1], it[2], it[3]); } });
    svg.setAttribute('aria-label', 'Схема номера ' + (W*H).toFixed(0) + ' м²');
  }
  function replay(box){ if (reduce) return; box.classList.remove('drawing'); void box.getBoundingClientRect(); box.classList.add('drawing'); }

  /* карточки: переключатель Фото / План и мини-схема */
  rooms.forEach(function(r){ var card = document.getElementById('r-'+r.id), vs = PLANS[r.id]; if (!vs) return;
    var ph = card.querySelector('.ph'), box = ph.querySelector('.pl'), cap = ph.querySelector('.mcap');
    drawPlan(box.querySelector('svg'), vs[0]);
    cap.innerHTML = (vs.length > 1 ? vs.length + ' ' + plural(vs.length,'вариант','варианта','вариантов') + ' планировки' : 'Планировка') + ' <b>Открыть →</b>';
    ph.querySelector('.mtog').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; var v = b.dataset.v; ph.dataset.view = v;
      this.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); }); if (v === 'plan') replay(box); });
    box.addEventListener('click', function(){ openPlan(r.id, 0); }); });
  if (!reduce && 'IntersectionObserver' in window){ var pio = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ replay(e.target); pio.unobserve(e.target); } }); }, {threshold:.35});
    document.querySelectorAll('.room .pl').forEach(function(b){ b.classList.add('wait'); pio.observe(b); }); }

  /* окно с планировками */
  var pm = document.getElementById('pm'), pmBd = document.getElementById('pmBd'), pmBox = document.getElementById('pmBox'), pmVars = document.getElementById('pmVars'), pmCur = null, pmLast = null;
  function openPlan(id, i){ var r = rooms.filter(function(x){ return x.id === id; })[0], vs = PLANS[id]; pmCur = id;
    document.getElementById('pmT').textContent = r.name; document.getElementById('pmMeta').textContent = r.tags.join(' · ') + ' · от ' + rub(r.price) + (r.half ? ' за ½ дома' : ' за ночь');
    pmVars.innerHTML = vs.length > 1 ? vs.map(function(v, k){ return '<button type="button" data-i="'+k+'" aria-pressed="'+(k===i)+'">'+v.n+'</button>'; }).join('') : ''; pmVars.hidden = vs.length < 2;
    showVar(i); var open = pm.classList.contains('on'); pmLast = open ? pmLast : document.activeElement;
    pm.classList.add('on'); pmBd.classList.add('on'); document.body.style.overflow = 'hidden'; if (!open) setTimeout(function(){ pm.focus({preventScroll:true}); }, 50);
    }
  function showVar(i){ var v = PLANS[pmCur][i]; drawPlan(pmBox.querySelector('svg'), v); replay(pmBox);
    document.getElementById('pmNote').textContent = v.note + ' · около ' + Math.round(v.p.W*v.p.H) + ' м²';
    pmVars.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', +b.dataset.i === i); }); }
  function closePlan(){ pm.classList.remove('on'); pmBd.classList.remove('on'); document.body.style.overflow = ''; if (pmLast && pmLast.focus) pmLast.focus({preventScroll:true}); }
  pmVars.addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) showVar(+b.dataset.i); });
  document.getElementById('pmX').onclick = closePlan; pmBd.onclick = closePlan;
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && pm.classList.contains('on')) closePlan(); });
  document.getElementById('pmPick').onclick = function(){ var r = rooms.filter(function(x){ return x.id === pmCur; })[0]; closePlan(); openBooking(r && r.hr); };


  /* ---------- Модуль бронирования HomeReserve ----------
     Строка поиска встаёт в блок «Подберём номер», окно с номерами и бронью модуль открывает сам.
     Кнопки «Забронировать» открывают поиск или сразу нужный номер. Если модуль не загрузился —
     кнопки ведут на страницу бронирования в новой вкладке. */
  var hrReady = false, hrBox = document.getElementById('hr-widget');
  function hrFallback(){ if (hrReady) return; hrBox.hidden = true; var fb = document.getElementById('hrFallback'); fb.hidden = false;
    if (PREVIEW) document.getElementById('hrFbTxt').textContent = 'На сайте здесь будет строка поиска модуля HomeReserve. В предпросмотре она не загружается.'; }
  (function(){ var s = document.createElement('script'); s.type = 'module'; s.src = 'https://homereserve.ru/widget.js';
    s.onload = function(){ try { window.homereserve.initWidgetSearch({token: HR.token, apartments: rooms.map(function(r){ return r.hr; }).filter(Boolean)}); hrReady = true; hrBox.hidden = false; document.getElementById('hrFallback').hidden = true; } catch (e) { hrFallback(); } };
    s.onerror = hrFallback; document.head.appendChild(s); setTimeout(hrFallback, 10000); })();
  /* На телефонах HomeReserve сам открывает свою страницу, поэтому ведём туда сразу, на нужный номер */
  /* Номер, открытый прямо с карточки: крестик модуля закрывает окно целиком, а не ведёт в общий список */
  var hrDirect = false;
  document.addEventListener('click', function(e){ if (hrDirect && e.target.closest('.vanilla-overlay > svg, .vanilla-overlay > button')){ hrDirect = false; setTimeout(function(){ location.hash = '#/'; }, 60); } }, true);
  window.addEventListener('hashchange', function(){ if (!/^#\/detail\//.test(location.hash) && location.hash !== '#/search') hrDirect = false; });
  var IS_MOBILE = /mobile|iphone|ipad|ipod|android/i.test(navigator.userAgent);
  function hrUrl(id){ return 'https://homereserve.ru/' + HR.token + (id ? '/detail/' + id : ''); }
  function openBooking(id){
    if (IS_MOBILE){ location.href = hrUrl(id); }
    else if (hrReady && window.homereserve){ hrDirect = !!id; location.hash = id ? '#/detail/' + id : '#/search'; }
    else { window.open(hrUrl(id), '_blank', 'noopener'); } }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-book]');
    if (b){ e.preventDefault(); if (b.closest('#siteMenu')) setMenu(false); openBooking(b.getAttribute('data-book')); return; }
    /* свои якоря (#rooms, #way…) прокручиваем сами, не трогая адрес: адресом пользуется модуль бронирования */
    var a = e.target.closest('a[href^="#"]'); if (!a || a.closest('#hr-modal, #hr-widget')) return;
    var id = a.getAttribute('href').slice(1); if (!id || id.charAt(0) === '/') return;
    var target = document.getElementById(id); if (!target) return;
    e.preventDefault(); target.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'}); });
  /* Расстояния, маршрут и схема дороги */
  Object.keys(DIST).forEach(function(k){ var v = DIST[k];
    document.querySelectorAll('[data-dist="' + k + '"]').forEach(function(el){ var b = el.querySelector('.dv');
      if (v){ b.textContent = v; } else if (PREVIEW){ b.textContent = '[?]'; } else { el.classList.add('nodist'); } }); });
  (function(){ var a = document.getElementById('heroRate'); if (!a) return; a.href = YA.url; a.querySelector('.rt').textContent = YA.rating; a.querySelector('.vt').textContent = YA.votes ? YA.votes + ' · ' : ''; a.setAttribute('aria-label', 'Оценка ' + YA.rating + ' из 5' + (YA.votes ? ', ' + YA.votes : '') + ' на Яндекс Картах'); })();
  document.getElementById('mapAzau').textContent = '← Азау · ' + (DIST.azau || '');
  document.getElementById('mapCheget').textContent = DIST.cheget ? DIST.cheget + ' от отеля' : '';
  document.getElementById('routeBtn').href = 'https://yandex.ru/maps/?rtext=~' + LAT + '%2C' + LON + '&rtt=auto';
  /* Плашка подъёмников на телефоне: Чегет и Азау по очереди, по нажатию или сами раз в 4 с */
  (function(){ var tile = document.querySelector('.fact-lift'); if (!tile) return;
    var items = [].slice.call(tile.querySelectorAll('.fl2>div:not(.nodist)')), dots = [].slice.call(tile.querySelectorAll('.fl-dots i')), i = 0, timer;
    if (items.length < 2){ tile.querySelector('.fl-dots').remove(); tile.removeAttribute('role'); tile.removeAttribute('tabindex'); return; }
    function show(n){ i = n % items.length; items.forEach(function(e, k){ e.classList.toggle('off', k !== i); }); dots.forEach(function(d, k){ d.classList.toggle('on', k === i); }); }
    function next(){ show(i + 1); }
    function auto(){ clearInterval(timer); if (!reduce) timer = setInterval(next, 4000); }
    tile.addEventListener('click', function(){ next(); auto(); });
    tile.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); next(); auto(); } });
    show(0); auto(); })();
  var rmap = document.querySelector('.rmap');
  rmap.querySelectorAll('path.d').forEach(function(p){ p.setAttribute('pathLength', '1'); });
  if (!reduce && 'IntersectionObserver' in window){ rmap.classList.add('wait'); var rio = new IntersectionObserver(function(es){ if (es[0].isIntersecting){ rmap.classList.add('drawing'); rio.disconnect(); } }, {threshold:.3}); rio.observe(rmap); }
  /* Мягкое появление блоков при прокрутке */
  if (!reduce && 'IntersectionObserver' in window){
    var els = document.querySelectorAll('.why>div, .room, .panel, .score, .rv, .road, .sec-h'), io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ var el = e.target; el.classList.add('in'); io.unobserve(el); setTimeout(function(){ el.classList.remove('rv-in','in'); el.style.transitionDelay = ''; }, 1000); } }); }, {rootMargin:'0px 0px -8% 0px'});
    els.forEach(function(el, i){ el.classList.add('rv-in'); el.style.transitionDelay = (i % 3)*70 + 'ms'; io.observe(el); });
  }
})();
</script>
